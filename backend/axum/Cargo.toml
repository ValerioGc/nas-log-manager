[package]
name = "nas-log-manager-axum"
version = "0.9.0"
edition = "2021"
autotests = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["sync", "time"] }
